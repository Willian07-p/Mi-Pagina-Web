    <!-- SCRIPT DE INTERACCIÓN -->
    <script>
        function toggleMenu() {
            const aside = document.getElementById("sidebar");
            const content = document.getElementById("main-content");
            const icon = document.getElementById("menu-icon");
            const isMobile = window.innerWidth <= 768;

            if (isMobile) {
                aside.classList.toggle("mostrar-mobile");
                const isOpen = aside.classList.contains("mostrar-mobile");
                icon.className = isOpen ? "fa-solid fa-xmark" : "fa-solid fa-bars";
            } else {
                aside.classList.toggle("oculta");
                content.classList.toggle("expandido");
                const isHidden = aside.classList.contains("oculta");
                icon.className = isHidden ? "fa-solid fa-arrow-right" : "fa-solid fa-bars";
            }
        }
    </script>
</body>
